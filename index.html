<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneFlow</title>
    <link rel="shortcut icon" href="Media/cd.png" type="image/x-icon">
    <link rel="stylesheet" href="Css/style.css">
    <script src="https://kit.fontawesome.com/81707a19bf.js" crossorigin="anonymous" defer></script>
</head>
<body>
    <div class="container">
        <div class="music-player">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
            <img src="Media/musicBG.jpg" alt="Album cover" class="song-img" loading="lazy">
            <h1 class="song-name"></h1>
            <p class="artist-name"></p>
            <audio id="song" preload="metadata">
                <source src="Media/remembering-you-130492.mp3" type="audio/mpeg">
            </audio>
            <input type="range" value="0" id="progress">
            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="controls">
                <div class="ex" id="shuffleBtn"><i class="fa-solid fa-shuffle extra"></i></div>
                <div id="prevSong"><i class="fa-solid fa-backward"></i></div>
                <div><i class="fa-solid fa-play" id="ctrlIcon"></i></div>
                <div id="nextSong"><i class="fa-solid fa-forward"></i></div>
                <div class="ex" id="repeatBtn"><i class="fa-solid fa-repeat extra"></i></div>
            </div>
            <div class="volume-control">
                <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
        <div class="playlist-menu" id="playlistMenu">
            <ul id="playlistList"></ul>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>
</html>
